# nginx как SNI-диспетчер порта 443: делит его между HelpDesk, сайтом-заглушкой
# и VLESS (Xray). Xray при этом переносится с 443 на 8443 (см. HTTPS.md).
#
# tracker-octron.ru -> HelpDesk (TLS терминируется здесь, проксируется на :8070)
# alexalq.ru        -> сайт-заглушка + VPN-подписки (как раньше)
# всё остальное     -> прозрачный проброс в Xray (VPN работает на 443 как прежде)

load_module /usr/lib/nginx/modules/ngx_stream_module.so;

events {}

# ---------------- Диспетчер 443 по SNI ----------------
stream {
    map $ssl_preread_server_name $backend443 {
        tracker-octron.ru       127.0.0.1:8444;
        www.tracker-octron.ru   127.0.0.1:8444;
        alexalq.ru              127.0.0.1:8445;
        default                 host.docker.internal:8443;   # VPN (xray)
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend443;
    }
}

http {
    server_tokens off;

    # ---------- HTTP :80 — ACME-челленджи и редирект на HTTPS ----------
    server {
        listen 80;
        server_name alexalq.ru tracker-octron.ru;

        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- Заглушка + VPN-подписки (внутренний порт 8445) ----------
    server {
        listen 8445 ssl;
        http2 on;
        server_name alexalq.ru;

        ssl_certificate     /etc/letsencrypt/live/alexalq.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/alexalq.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        location /sub-alexalq/ {
            proxy_pass https://host.docker.internal:2096/sub-alexalq/;
            proxy_ssl_verify off;
            proxy_set_header Host alexalq.ru;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ---------- HelpDesk (внутренний порт 8444) ----------
    server {
        listen 8444 ssl;
        http2 on;
        server_name tracker-octron.ru www.tracker-octron.ru;

        ssl_certificate     /etc/letsencrypt/live/tracker-octron.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tracker-octron.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # вложения до 100 МБ (фото/видео в задачах и чате)
        client_max_body_size 100m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;

        location / {
            proxy_pass http://host.docker.internal:8070;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
