services:
  web:
    build: .
    container_name: helpdesk_web
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Default: SQLite stored on the mounted volume (zero external deps).
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/helpdesk.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-please}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@helpdesk.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-helpdesk@localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
    volumes:
      - helpdesk_data:/data

  # HTTPS-фронт на отдельном публичном IP (PUBLIC_IP в .env).
  # Caddy сам получает и продлевает сертификат Let's Encrypt для DOMAIN.
  # network_mode: host — слушаем PUBLIC_IP:80/443 напрямую, без docker-NAT:
  # ответы уходят от имени хоста и корректно маршрутизируются политикой
  # "from PUBLIC_IP -> eth1" (см. deploy/HTTPS.md).
  proxy:
    image: caddy:2
    container_name: helpdesk_proxy
    restart: unless-stopped
    depends_on:
      - web
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:-tracker-octron.ru}
      PUBLIC_IP: ${PUBLIC_IP:-0.0.0.0}
      # web публикует порт на хосте, поэтому из host-сети он 127.0.0.1:PORT
      UPSTREAM: 127.0.0.1:${PORT:-8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Optional PostgreSQL. To use it, set in .env:
  #   DATABASE_URL=postgresql+psycopg2://helpdesk:helpdesk@db:5432/helpdesk
  # and uncomment the "depends_on" above plus this service.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: helpdesk
  #     POSTGRES_PASSWORD: helpdesk
  #     POSTGRES_DB: helpdesk
  #   volumes:
  #     - helpdesk_pg:/var/lib/postgresql/data

volumes:
  helpdesk_data:
  caddy_data:
  caddy_config:
  # helpdesk_pg:
